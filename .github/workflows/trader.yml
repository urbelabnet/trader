# La sveglia di GitHub Actions: non c'è `bun run schedule`, c'è il cron.
# Il codice dentro `bun run once` fa la domanda: "qual è la sveglia dovuta di oggi,
# più recente dell'ultimo testimone?" Se c'è, la lancia; se no, esce in un minuto.
# Lo stato vive nel repository: testimone e log si committano a ogni sveglia.
#
# Repo PRIVATO: i minuti Actions sono quotati (2.000/mese sul piano gratis), quindi
# il cron controlla solo attorno alle 4 sveglie vere invece che ogni 10 minuti tutto il giorno.
# ~11 controlli al giorno nei feriali, ~6 nel weekend: circa 290 run/mese, ben sotto quota.
# Il ritardo massimo da orario dovuto a sveglia effettiva resta ~5–15 minuti (vedi i commenti UTC).

name: sveglia

on:
  schedule:
    # Briefing delle 09:00 Roma: controlli ogni 10 minuti, 09:05–09:55 ora legale e ora solare,
    # entrambe coperte dai controlli nell'ora 07 UTC (07:05–07:55 legale, 08:05–08:55 solare).
    - cron: "5-55/10 7 * * *"
    # Mercato 15:40 Roma: controlli alle 13:45 UTC (15:45 ora legale) e 14:45 UTC (15:45 ora solare).
    - cron: "45 13,14 * * 1-5"
    # Mercato 18:30 Roma: controllo alle 16:35 UTC (18:35 legale) e 17:45 UTC (18:45 solare).
    - cron: "35 16 * * 1-5"
    - cron: "45 17 * * 1-5"
    # Mercato 21:40 Roma: controlli alle 19:45 UTC (21:45 legale) e 20:45 UTC (21:45 solare),
    # sempre dentro l'orario di Borsa (chiude alle 22:00 Roma).
    - cron: "45 19,20 * * 1-5"
  workflow_dispatch: {} # per farla partire a mano

concurrency:
  group: tarantola
  cancel-in-progress: false # una sveglia alla volta, sempre in fila, mai in parallelo

permissions:
  contents: write # per committare lo stato

jobs:
  sveglia:
    runs-on: ubuntu-latest
    outputs:
      cambiate: ${{ steps.stato.outputs.cambiate }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: svolgi la sveglia dovuta (il codice decide se è l'ora)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run once

      - name: persisti il testimone e i log nel repository
        id: stato
        run: |
          git config user.name "tarantola"
          git config user.email "tarantola@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git add -A state logs
          if git diff --cached --quiet || [ ! -f state/baton.json ]; then
            echo "cambiate=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "stato sveglia $(date -u +%FT%TZ)"
            git push
            echo "cambiate=true" >> "$GITHUB_OUTPUT"
          fi

# La «pagina di stato» su GitHub Pages richiede un piano a pagamento sui repository privati.
# La pagina resta comunque generata e committata in state/status.html: si apre dal
# pulsante «Raw» del file, da GitHub, dopo il login.
