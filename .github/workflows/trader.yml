# La sveglia di GitHub Actions: non c'è `bun run schedule`, c'è il cron.
# Il codice dentro `bun run once` fa la domanda: "qual è la sveglia dovuta di oggi,
# più recente dell'ultimo testimone?" Se c'è, la lancia; se no, esce in un minuto.
# Lo stato vive nel repository: il testimone si commette a ogni sveglia.
#
# Il repo è PUBBLICO: Pages e minuti Actions gratuiti senza soffocamento.
# Ogni sveglia ha due fuochi di controlli (ora legale e ora solare, ±jitter di coda)
# così una sveglia mancata non aspetta mai il pomeriggio.

name: sveglia

on:
  schedule:
    # Briefing delle 09:00 Roma: controlli nell'ora 07 UTC (09:05–09:55 ora legale)
    # e nell'ora 08 UTC (09:05–09:55 ora solare): il cambio ora copre ambo i fuochi
    # (i controlli dell'ora sbagliata semplicemente escono: «niente da fare»).
    - cron: "5-55/10 7,8 * * *"
    # Mercato 15:40 Roma: minuti 45 e 55 delle ore 13 e 14 UTC; il secondo fuoco
    # tiene conto del ritardo/anticipo del cron di Actions (~10 minuti di gioco).
    - cron: "45,55 13,14 * * 1-5"
    # Mercato 18:30 Roma: stessi criteri (ore 16 e 17 UTC).
    - cron: "45,55 16,17 * * 1-5"
    # Mercato 21:40 Roma (borsa chiude alle 22:00: dentro i termini anche se il cron è in ritardo).
    - cron: "45,55 19,20 * * 1-5"
  workflow_dispatch: {} # per farla partire a mano

concurrency:
  group: tarantola
  cancel-in-progress: false # una sveglia alla volta, sempre in fila, mai in parallelo

permissions:
  contents: write   # per committare lo stato
  pages: write      # per pubblicare la cruscotto su Pages
  id-token: write   # autenticazione richiesta dal deploy Pages

jobs:
  sveglia:
    runs-on: ubuntu-latest
    outputs:
      cambiate: ${{ steps.stato.outputs.cambiate }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: svolgi la sveglia dovuta (il codice decide se è l'ora)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run once

      - name: persisti il testimone nel repository
        id: stato
        run: |
          git config user.name "tarantola"
          git config user.email "tarantola@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          # Solo state/: i log di processo restano locali. Il `--` evita che un
          # percorso assente faccia fallire il passo (difetto visto il 27/10: la
          # sveglia girava ma lo stato non arrivava più nel repository).
          git add -A -- state
          if git diff --cached --quiet || [ ! -f state/baton.json ]; then
            echo "cambiate=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "stato sveglia $(date -u +%FT%TZ)"
            git push
            echo "cambiate=true" >> "$GITHUB_OUTPUT"
          fi

      # Il passo di sopra è rotto? La sveglia comunque parla: correggi il codice, non il test —
      # ma l'utente deve SAPERLO, altrimenti lo stato resta fermo senza che nessuno lo veda.
      - name: avvisa su Telegram se il passo di persistenza è caduto
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠ La sveglia ha girato ma il suo stato NON è arrivato nel repository: la cruscotto è ferma finché non passa il nostro passo (vedi Actions). Riscontro e ordini al broker restano buoni." || true

  # La cruscotto su Pages: a ogni sveglia che cambia lo stato la pagina viene ripubblicata.
  # Pubblico = Pages gratis e minuti Actions illimitati: la cruscotto è sempre raggiungibile
  # da smartphone, senza login, all'indirizzo https://urbelabnet.github.io/trader/status.html
  cruscotto:
    needs: sveglia
    # pubblica se lo stato è cambiato, oppure sempre quando la sveglia è partita a mano
    # (workflow_dispatch): serve anche solo per ripubblicare il presente.
    if: needs.sveglia.outputs.cambiate == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # l'SHA del run è quello PRIMA delle commmessa di stato del job sveglia:
          # prendo la punta corrente del ramo, con il testimone di ora.
          ref: ${{ github.ref_name }}

      - name: copia la cruscotto come indice del sito
        run: cp state/status.html state/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: state

      - id: pubblica
        uses: actions/deploy-pages@v4
